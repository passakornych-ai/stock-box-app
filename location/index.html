<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOCK BOX OS // Location Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="../js/theme.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="app-container header-inner">
      <div class="header-brand">
        <div style="width:38px;height:38px;border-radius:11px;background:var(--c-cyan-soft-bg);border:1px solid var(--c-cyan-soft-border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">
          📍
        </div>
        <div style="min-width:0;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <h1 class="txt-primary" style="margin:0;font-size:16px;font-weight:700;white-space:nowrap;">
              LOCATION <span class="mono txt-cyan" style="font-size:13px;">MATRIX</span>
            </h1>
            <span id="dbStatusBadge" class="mono status-pill-active" style="padding:2px 8px;font-size:11px;">
              ● LIVE
            </span>
          </div>
          <p class="txt-muted" style="margin:2px 0 0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
            ผังแสดงสถานะช่องจัดเก็บสินค้าแบบเรียลไทม์
          </p>
        </div>
      </div>

      <div class="header-actions">
        <button id="themeToggleBtn" type="button" onclick="toggleTheme()" class="btn btn-ghost">
          <span>☀️</span>
          <span>โหมดสว่าง</span>
        </button>
        <a href="../" class="btn btn-emerald-soft">
          <span>←</span>
          <span>สต็อกคงเหลือ</span>
        </a>
        <a href="../receive/" class="btn btn-ghost">
          <span>📥</span>
          <span>รับเข้าสินค้า</span>
        </a>
        <a href="../issue/" class="btn btn-ghost">
          <span>📤</span>
          <span>เบิกออก</span>
        </a>
        <a href="../move/" class="btn btn-ghost">
          <span>🔀</span>
          <span>ย้ายสินค้า</span>
        </a>
        <button id="refreshBtn" type="button" onclick="loadLocationMatrix()" class="btn btn-cyan">
          <span>↻</span>
          <span>รีเฟรช</span>
        </button>
      </div>
    </div>
  </header>

  <main class="app-container" style="padding-top:24px;padding-bottom:40px;display:flex;flex-direction:column;gap:20px;">

    <!-- Summary Strip -->
    <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;">
      <div class="panel" style="padding:18px 20px;display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div class="mono txt-muted" style="font-size:11px;text-transform:uppercase;">Total Slots</div>
          <div id="statTotal" class="mono txt-primary" style="margin-top:6px;font-size:28px;font-weight:700;">0</div>
        </div>
        <span class="mono txt-secondary" style="padding:5px 12px;border-radius:999px;font-size:11px;background:var(--bg-subtle);">ALL</span>
      </div>

      <div class="panel" style="padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-color:var(--c-emerald-soft-border);">
        <div>
          <div class="mono txt-emerald" style="font-size:11px;text-transform:uppercase;">Occupied Slots</div>
          <div id="statOccupied" class="mono txt-emerald" style="margin-top:6px;font-size:28px;font-weight:700;">0</div>
        </div>
        <span class="status-pill-active">มีของ</span>
      </div>

      <div class="panel" style="padding:18px 20px;display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div class="mono txt-muted" style="font-size:11px;text-transform:uppercase;">Available Slots</div>
          <div id="statEmpty" class="mono txt-cyan" style="margin-top:6px;font-size:28px;font-weight:700;">0</div>
        </div>
        <span style="padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--c-cyan-soft-bg);color:var(--c-cyan);border:1px solid var(--c-cyan-soft-border);">ว่าง</span>
      </div>
    </section>

    <!-- Filter & Search -->
    <section class="panel" style="padding:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <button type="button" data-filter="all" class="filter-btn btn btn-cyan">ทั้งหมด</button>
        <button type="button" data-filter="occupied" class="filter-btn btn btn-ghost">มีของ</button>
        <button type="button" data-filter="empty" class="filter-btn btn btn-ghost">ว่าง</button>
      </div>
      <input id="locSearch" type="text" class="input-control" style="width:100%;max-width:300px;"
        placeholder="ค้นหาชื่อช่อง เช่น TA201/1..." />
    </section>

    <!-- Matrix Grid -->
    <section class="panel" style="padding:20px;">
      <div id="locLoading" class="mono txt-muted" style="padding:36px 12px;text-align:center;font-size:12px;">
        LOADING LOCATION MATRIX...
      </div>
      <div id="locationGrid" class="slot-grid"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/location.js"></script>
</body>
</html>
