<!-- โหลด Config กลางที่แยกไว้ -->
    <script src="js/config.js"></script>
    
    <script>
        // ฟังก์ชันดึงข้อมูลผัง Location และ Stock มาจับคู่แสดงผล
        async function loadLocations() {
            const loadingEl = document.getElementById('loadingLocation');
            const gridEl = document.getElementById('locationGrid');
            
            loadingEl.style.display = 'block';
            gridEl.innerHTML = '';

            try {
                // 1. ดึงข้อมูลช่อง Location ทั้งหมดจากตาราง locations
                const { data: locData, error: locError } = await _supabase
                    .from('locations')
                    .select('*');

                if (locError) throw locError;

                // 2. ดึงข้อมูลสินค้าคงเหลือจากตาราง stock_box เพื่อเช็กว่าช่องไหนมีของ
                const { data: stockData, error: stockError } = await _supabase
                    .from('stock_box')
                    .select('*');

                if (stockError) throw stockError;

                loadingEl.style.display = 'none';

                if (!locData || locData.length === 0) {
                    gridEl.innerHTML = `<p class="col-span-full text-center text-gray-400 py-8">ไม่พบข้อมูล Location ในระบบ</p>`;
                    return;
                }

                // ทำ Mapping เช็กว่า Location ไหนมีสินค้าอยู่บ้าง (เทียบกับ Location_Name ใน stock_box)
                const stockMap = {};
                if (stockData) {
                    stockData.forEach(item => {
                        const locName = item.Location_Name || item.location_name || item.LocationID || item.location_id;
                        const qty = item.QtyBalance ?? item.qty_balance ?? 1;
                        if (locName) {
                            stockMap[locName] = (stockMap[locName] || 0) + Number(qty);
                        }
                    });
                }

                let total = locData.length;
                let occupied = 0;

                locData.forEach(loc => {
                    // ดึงค่าจากคอลัมน์ LocationID (รองรับหลายรูปแบบเพื่อความปลอดภัย)
                    const code = loc.LocationID || loc.location_id || loc.Location_Name || loc.location_name || 'Unknown';
                    const qty = stockMap[code] || 0;
                    const isOccupied = qty > 0;

                    if (isOccupied) occupied++;

                    const card = document.createElement('div');
                    card.className = `p-4 rounded-xl border flex flex-col items-center justify-center transition shadow-sm ${
                        isOccupied 
                            ? 'bg-emerald-50/70 border-emerald-200 text-emerald-900 hover:bg-emerald-100' 
                            : 'bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100'
                    }`;

                    card.innerHTML = `
                        <span class="font-bold text-sm tracking-wide">${code}</span>
                        <span class="text-xs mt-1 font-medium">
                            ${isOccupied ? `📦 (${qty})` : 'ว่าง'}
                        </span>
                    `;
                    gridEl.appendChild(card);
                });

                // อัปเดตตัวเลขสถิติสรุปด้านบน
                document.getElementById('totalLoc').textContent = total;
                document.getElementById('occupiedLoc').textContent = occupied;
                document.getElementById('emptyLoc').textContent = total - occupied;

            } catch (err) {
                loadingEl.style.display = 'none';
                gridEl.innerHTML = `<p class="col-span-full text-center text-red-500 py-8">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</p>`;
            }
        }

        // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
        document.addEventListener('DOMContentLoaded', () => {
            loadLocations();
        });
    </script>
