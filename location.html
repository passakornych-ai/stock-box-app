<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOCK BOX OS // Location Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="app-header">
    <div class="app-container" style="height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px;">
      <div style="display:flex;align-items:center;gap:12px;min-width:0;">
        <div style="width:40px;height:40px;border-radius:12px;background:rgba(16,185,129,0.15);border:1px solid rgba(52,211,153,0.35);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">
          📍
        </div>
        <div style="min-width:0;">
          <h1 style="margin:0;font-size:17px;font-weight:700;color:#f8fafc;">
            LOCATION <span class="mono" style="color:#34d399;font-size:13px;">MATRIX</span>
          </h1>
          <p style="margin:2px 0 0;font-size:12px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
            ผังแสดงสถานะช่องจัดเก็บสินค้าแบบเรียลไทม์
          </p>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
        <a href="index.html" class="btn btn-ghost">
          <span>←</span>
          <span>แดชบอร์ด</span>
        </a>
        <button type="button" onclick="loadLocationMatrix()" class="btn btn-emerald">
          <span>↻</span>
          <span>รีเฟรชผัง</span>
        </button>
      </div>
    </div>
  </header>

  <main class="app-container" style="padding-top:24px;padding-bottom:40px;display:flex;flex-direction:column;gap:20px;">

    <!-- Summary Strip -->
    <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;">
      <div class="panel" style="padding:18px 20px;display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div class="mono" style="font-size:11px;color:#94a3b8;text-transform:uppercase;">Total Slots</div>
          <div id="statTotal" class="mono" style="margin-top:6px;font-size:28px;font-weight:700;color:#f8fafc;">0</div>
        </div>
        <span class="mono" style="padding:5px 12px;border-radius:999px;font-size:11px;background:#1e293b;color:#cbd5e1;">ALL</span>
      </div>

      <div class="panel" style="padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-color:rgba(52,211,153,0.3);">
        <div>
          <div class="mono" style="font-size:11px;color:#6ee7b7;text-transform:uppercase;">Occupied Slots</div>
          <div id="statOccupied" class="mono" style="margin-top:6px;font-size:28px;font-weight:700;color:#6ee7b7;">0</div>
        </div>
        <span style="padding:5px 12px;border-radius:999px;font-size:12px;background:rgba(16,185,129,0.16);color:#6ee7b7;border:1px solid rgba(52,211,153,0.35);">มีของ</span>
      </div>

      <div class="panel" style="padding:18px 20px;display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div class="mono" style="font-size:11px;color:#94a3b8;text-transform:uppercase;">Available Slots</div>
          <div id="statEmpty" class="mono" style="margin-top:6px;font-size:28px;font-weight:700;color:#67e8f9;">0</div>
        </div>
        <span style="padding:5px 12px;border-radius:999px;font-size:12px;background:rgba(34,211,238,0.12);color:#67e8f9;border:1px solid rgba(34,211,238,0.28);">ว่าง</span>
      </div>
    </section>

    <!-- Filter & Search -->
    <section class="panel" style="padding:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <button type="button" data-filter="all" class="filter-btn btn btn-cyan">ทั้งหมด</button>
        <button type="button" data-filter="occupied" class="filter-btn btn btn-ghost">มีของ</button>
        <button type="button" data-filter="empty" class="filter-btn btn btn-ghost">ว่าง</button>
      </div>
      <input id="locSearch" type="text" class="input-control" style="width:100%;max-width:300px;"
        placeholder="ค้นหาชื่อช่อง เช่น TA201/1..." />
    </section>

    <!-- Matrix Grid -->
    <section class="panel" style="padding:20px;">
      <div id="locLoading" class="mono" style="padding:36px 12px;text-align:center;font-size:12px;color:#94a3b8;">
        LOADING LOCATION MATRIX...
      </div>
      <div id="locationGrid" class="slot-grid"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/location.js"></script>
</body>
</html>
