<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผัง Location - Stock Box System</title>
    
    <!-- Tailwind CSS ผ่าน CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS Client ผ่าน CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-6 md:p-10">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header & Nav Menu -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-200 pb-6 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">
                    📍 ผังแสดงตำแหน่ง Location
                </h1>
                <p class="text-sm text-gray-500 mt-1">
                    ตรวจสอบสถานะช่องจัดเก็บสินค้าภายในคลังสินค้าแบบเรียลไทม์
                </p>
            </div>
            
            <!-- เมนูกลับหน้าหลัก -->
            <div>
                <a href="index.html" class="inline-flex items-center space-x-2 bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2.5 rounded-xl text-sm font-medium transition">
                    <span>🏠</span>
                    <span>กลับหน้าแดชบอร์ดหลัก</span>
                </a>
            </div>
        </div>

        <!-- Action Toolbar & Stats Summary -->
        <div class="flex flex-wrap justify-between items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <button onclick="loadLocations()" class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-sm transition">
                <span>🔄</span>
                <span>โหลดข้อมูลผังใหม่</span>
            </button>

            <!-- Status Pills Stats -->
            <div class="flex flex-wrap gap-3">
                <div class="px-4 py-2 rounded-xl text-sm font-medium bg-blue-50 border border-blue-200 text-blue-700">
                    📍 Location ทั้งหมด: <b id="totalLoc">0</b> ช่อง
                </div>
                <div class="px-4 py-2 rounded-xl text-sm font-medium bg-emerald-50 border border-emerald-200 text-emerald-700">
                    🟢 Location ที่มีของ: <b id="occupiedLoc">0</b> ช่อง
                </div>
                <div class="px-4 py-2 rounded-xl text-sm font-medium bg-gray-100 border border-gray-200 text-gray-600">
                    ⚪ Location ว่าง: <b id="emptyLoc">0</b> ช่อง
                </div>
            </div>
        </div>

        <!-- Grid Layout for Locations -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <div id="loadingLocation" class="text-center py-12 text-gray-400">
                กำลังโหลดผัง Location จาก Supabase...
            </div>
            
            <!-- ตารางแสดงช่อง Location แบบ Grid -->
            <div id="locationGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <!-- ช่อง Location จะถูกสร้างแทรกด้วย JavaScript -->
            </div>
        </div>

    </div>

    <!-- โหลด Config กลางที่แยกไว้ -->
    <script src="js/config.js"></script>
    
    <script>
        // ฟังก์ชันดึงข้อมูลผัง Location และ Stock มาจับคู่แสดงผล
        async function loadLocations() {
            const loadingEl = document.getElementById('loadingLocation');
            const gridEl = document.getElementById('locationGrid');
            
            loadingEl.style.display = 'block';
            gridEl.innerHTML = '';

            try {
                // 1. ดึงข้อมูลช่อง Location ทั้งหมดจากตาราง locations
                const { data: locData, error: locError } = await _supabase
                    .from('locations')
                    .select('*');

                if (locError) throw locError;

                // 2. ดึงข้อมูลสินค้าคงเหลือจากตาราง stock_box เพื่อเช็กว่าช่องไหนมีของ
                const { data: stockData, error: stockError } = await _supabase
                    .from('stock_box')
                    .select('Location_Name, QtyBalance');

                if (stockError) throw stockError;

                loadingEl.style.display = 'none';

                if (!locData || locData.length === 0) {
                    gridEl.innerHTML = `<p class="col-span-full text-center text-gray-400 py-8">ไม่พบข้อมูล Location ในระบบ</p>`;
                    return;
                }

                // ทำ Mapping เช็กว่า Location ไหนมีสินค้าอยู่บ้าง
                const stockMap = {};
                if (stockData) {
                    stockData.forEach(item => {
                        const locName = item.Location_Name || item.location_name;
                        if (locName) {
                            stockMap[locName] = (stockMap[locName] || 0) + (item.QtyBalance ?? item.qty_balance ?? 1);
                        }
                    });
                }

                let total = locData.length;
                let occupied = 0;

                locData.forEach(loc => {
                    const code = loc.Location_Name || loc.location_name || 'Unknown';
                    const qty = stockMap[code] || 0;
                    const isOccupied = qty > 0;

                    if (isOccupied) occupied++;

                    const card = document.createElement('div');
                    card.className = `p-4 rounded-xl border flex flex-col items-center justify-center transition shadow-sm ${
                        isOccupied 
                            ? 'bg-emerald-50/70 border-emerald-200 text-emerald-900 hover:bg-emerald-100' 
                            : 'bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100'
                    }`;

                    card.innerHTML = `
                        <span class="font-bold text-sm tracking-wide">${code}</span>
                        <span class="text-xs mt-1 font-medium">
                            ${isOccupied ? `📦 (${qty})` : 'ว่าง'}
                        </span>
                    `;
                    gridEl.appendChild(card);
                });

                // อัปเดตตัวเลขสถิติสรุปด้านบน
                document.getElementById('totalLoc').textContent = total;
                document.getElementById('occupiedLoc').textContent = occupied;
                document.getElementById('emptyLoc').textContent = total - occupied;

            } catch (err) {
                loadingEl.style.display = 'none';
                gridEl.innerHTML = `<p class="col-span-full text-center text-red-500 py-8">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</p>`;
            }
        }

        // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
        document.addEventListener('DOMContentLoaded', () => {
            loadLocations();
        });
    </script>
</body>
</html>
